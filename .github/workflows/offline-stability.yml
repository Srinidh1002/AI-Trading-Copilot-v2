name: offline-stability

on:
  push:
    branches:
      - five-market-offline-readiness
  pull_request:
    branches:
      - five-market-offline-readiness
  workflow_dispatch:

jobs:
  offline-tests:
    name: Offline stability suite
    runs-on: windows-latest
    timeout-minutes: 20

    env:
      PYTHONUNBUFFERED: "1"
      PYTHONUTF8: "1"
      PYTHONDONTWRITEBYTECODE: "1"
      PYTHONPATH: "${{ github.workspace }}/src;${{ github.workspace }}"
      FYERS_APP_ID: ""
      FYERS_ACCESS_TOKEN: ""

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install runtime lock (validated deps only)
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-runtime-lock.txt
          python -m pip install pytest ruff

      - name: Syntax check (portable Python helper)
        shell: pwsh
        run: python tools/offline_syntax_check.py

      - name: Ruff check on maintained files
        shell: pwsh
        run: |
          python -m ruff check `
            tools/offline_syntax_check.py `
            tools/preflight_and_start_five_market_paper.py `
            tools/collect_mcx_fyers_execution_calibration.py `
            tools/verify_mcx_fyers_execution_calibration.py `
            tools/write_mcx_fyers_execution_calibration.py `
            tools/resolve_counterfactuals.py `
            tools/expectancy_report.py `
            services/paper_orchestration/process_lock_v2.py `
            services/paper_orchestration/supervisor_lock_v2.py `
            services/paper_orchestration/worker_lock_v2.py `
            services/paper_orchestration/worker_session_authority_v2.py `
            services/paper_orchestration/cooperative_stop_v2.py `
            services/paper_orchestration/certification_halt_v2.py `
            services/paper_orchestration/state_authority_readonly_v2.py `
            services/broker/fyers_auth_v2.py `
            src/rate_limiter.py `
            src/mcx/mcx_counterfactual.py

      - name: Focused offline test suite
        shell: pwsh
        run: |
          python -m pytest `
            tests/test_p0_runtime_lock_v2.py `
            tests/test_p0_scheduled_task_v2.py `
            tests/test_p0_counterfactual_resolver_v2.py `
            tests/test_p0_counterfactual_capture_v2.py `
            tests/test_p0_preflight_paper_safety_and_exit_codes_v2.py `
            tests/test_p0_preflight_v2.py `
            tests/test_p0_preflight_mcx_health_v2.py `
            tests/test_p0_preflight_auth_authority_v2.py `
            tests/test_p0_state_authority_readonly_v2.py `
            tests/test_p0_preflight_calibration_gate_v2.py `
            tests/test_p0_mcx_calibration_workflow_v2.py `
            tests/test_p0_supervisor_stop_ack_v2.py `
            tests/test_p0_cooperative_stop_ack_v2.py `
            tests/test_p0_cooperative_stop_v2.py `
            tests/test_p0_analysis_retry_v2.py `
            tests/test_p0_supervisor_start_failure_v2.py `
            tests/test_p0_token_and_analysis_v2.py `
            tests/test_p0_index_close_authority_v2.py `
            tests/test_p0_supervisor_lifecycle_v2.py `
            tests/test_p0_state_authority_v2.py `
            tests/test_p0_certification_authority_v2.py `
            tests/test_p0_windows_lock_foundation.py `
            tests/test_p0_gate_b_fail_closed.py `
            -q --tb=short

      - name: Confirm no live-state artifact was created in the repo
        shell: pwsh
        run: |
          $bad = @()
          foreach ($p in @(
              "data\rate_limit\state.json.lock",
              "data\rate_limit\state.json.lock.guard",
              "logs\supervisor\.lock")) {
              if (Test-Path $p) { $bad += $p }
          }
          if ($bad.Count -gt 0) {
              Write-Host "FORBIDDEN artifacts: $bad"
              exit 1
          }
          Write-Host "clean"
