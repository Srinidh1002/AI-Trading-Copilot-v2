name: r16-focused

on:
  push:
    branches:
      - r16-final-product-hardening
  pull_request:
    branches:
      - r15-five-market-release-v1
  workflow_dispatch:

jobs:
  r16-focused:
    name: R16 focused safety and architecture gate
    runs-on: windows-latest
    timeout-minutes: 25

    env:
      PYTHONUNBUFFERED: "1"
      PYTHONUTF8: "1"
      PYTHONDONTWRITEBYTECODE: "1"
      PYTHONPATH: "${{ github.workspace }}/src;${{ github.workspace }}"
      FYERS_APP_ID: ""
      FYERS_ACCESS_TOKEN: ""

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install validated runtime and test tooling
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-runtime-lock.txt
          python -m pip install pytest ruff

      - name: Compile R16 and modified FYERS files
        shell: pwsh
        run: |
          $files = @(
            "services/broker/fyers_master_readiness_v2.py",
            "services/broker/fyers_five_market_resolver_v2.py",
            "services/broker/fyers_response_normalizer_v2.py",
            "services/options/angel_option_chain_normalizer.py",
            "services/analysis/live_market_candidate_evaluator.py",
            "services/options/fyers_option_chain_provider_v2.py",
            "services/options/fyers_native_option_chain_engine_v2.py",
            "services/options/r16_fyers_native_option_capture_v1.py",
            "services/paper_orchestration/five_market_campaign_read_model_v2.py",
            "services/paper_orchestration/r16_two_market_shadow_source_v1.py",
            "services/paper_orchestration/r16_canonical_candidate_reader_v1.py",
            "services/paper_orchestration/r16_fyers_shadow_composition_v1.py",
            "services/paper_orchestration/r16_strategy_authority_v1.py",
            "services/paper_orchestration/r16_selector_paper_runtime_v1.py",
            "services/reporting/five_market_certification_final_report_v1.py",
            "services/live_execution/r16_pre_live_eligibility_v1.py",
            "dashboard/five_market_campaign_sync_v2.py",
            "dashboard/five_market_certification_components_v2.py",
            "dashboard/dashboard_v2.py",
            "tools/preflight_and_start_five_market_paper.py",
            "tools/generate_five_market_certification_report.py",
            "tools/run_r16_two_market_shadow_once.py"
          )
          python -m py_compile @files

      - name: Ruff R16 maintained files
        continue-on-error: true
        shell: pwsh
        run: |
          $files = @(
            "services/broker/fyers_master_readiness_v2.py",
            "services/options/angel_option_chain_normalizer.py",
            "services/analysis/live_market_candidate_evaluator.py",
            "services/options/r16_fyers_native_option_capture_v1.py",
            "services/paper_orchestration/five_market_campaign_read_model_v2.py",
            "services/paper_orchestration/r16_two_market_shadow_source_v1.py",
            "services/paper_orchestration/r16_canonical_candidate_reader_v1.py",
            "services/paper_orchestration/r16_fyers_shadow_composition_v1.py",
            "services/paper_orchestration/r16_strategy_authority_v1.py",
            "services/paper_orchestration/r16_selector_paper_runtime_v1.py",
            "services/reporting/five_market_certification_final_report_v1.py",
            "services/live_execution/r16_pre_live_eligibility_v1.py",
            "dashboard/five_market_campaign_sync_v2.py",
            "dashboard/five_market_certification_components_v2.py",
            "tools/generate_five_market_certification_report.py",
            "tools/run_r16_two_market_shadow_once.py",
            "tests/test_r16_fyers_master_readiness_v2.py",
            "tests/test_r16_five_market_campaign_read_model_v2.py",
            "tests/test_r16_two_market_shadow_source_v1.py",
            "tests/test_r16_canonical_candidate_reader_v1.py",
            "tests/test_r16_fyers_native_option_capture_v1.py",
            "tests/test_r16_fyers_shadow_composition_v1.py",
            "tests/test_r16_strategy_authority_v1.py",
            "tests/test_r16_selector_paper_runtime_v1.py",
            "tests/test_r16_pre_live_eligibility_v1.py",
            "tests/test_r16_five_market_certification_final_report_v1.py"
          )
          python -m ruff check @files

      - name: Test p0 preflight v2
        continue-on-error: true
        shell: pwsh
        run: python -m pytest tests/test_p0_preflight_v2.py -q --tb=short

      - name: Test fyers option chain provider v2
        continue-on-error: true
        shell: pwsh
        run: python -m pytest tests/test_fyers_option_chain_provider_v2.py -q --tb=short

      - name: Test f13 fyers native option chain engine v2
        continue-on-error: true
        shell: pwsh
        run: python -m pytest tests/test_f13_fyers_native_option_chain_engine_v2.py -q --tb=short

      - name: Test r16 fyers master readiness v2
        continue-on-error: true
        shell: pwsh
        run: python -m pytest tests/test_r16_fyers_master_readiness_v2.py -q --tb=short

      - name: Test r16 five market campaign read model v2
        continue-on-error: true
        shell: pwsh
        run: python -m pytest tests/test_r16_five_market_campaign_read_model_v2.py -q --tb=short

      - name: Test r16 two market shadow source v1
        continue-on-error: true
        shell: pwsh
        run: python -m pytest tests/test_r16_two_market_shadow_source_v1.py -q --tb=short

      - name: Test r16 canonical candidate reader v1
        continue-on-error: true
        shell: pwsh
        run: python -m pytest tests/test_r16_canonical_candidate_reader_v1.py -q --tb=short

      - name: Test r16 fyers native option capture v1
        continue-on-error: true
        shell: pwsh
        run: python -m pytest tests/test_r16_fyers_native_option_capture_v1.py -q --tb=short

      - name: Test r16 fyers shadow composition v1
        continue-on-error: true
        shell: pwsh
        run: python -m pytest tests/test_r16_fyers_shadow_composition_v1.py -q --tb=short

      - name: Test r16 strategy authority v1
        continue-on-error: true
        shell: pwsh
        run: python -m pytest tests/test_r16_strategy_authority_v1.py -q --tb=short

      - name: Test r16 selector paper runtime v1
        continue-on-error: true
        shell: pwsh
        run: python -m pytest tests/test_r16_selector_paper_runtime_v1.py -q --tb=short

      - name: Test r16 pre live eligibility v1
        continue-on-error: true
        shell: pwsh
        run: python -m pytest tests/test_r16_pre_live_eligibility_v1.py -q --tb=short

      - name: Test r16 five market certification final report v1
        continue-on-error: true
        shell: pwsh
        run: python -m pytest tests/test_r16_five_market_certification_final_report_v1.py -q --tb=short

      - name: Aggregate diagnostic group A
        continue-on-error: true
        shell: pwsh
        run: |
          $tests = @("tests/test_p0_preflight_v2.py","tests/test_fyers_option_chain_provider_v2.py","tests/test_f13_fyers_native_option_chain_engine_v2.py","tests/test_r16_fyers_master_readiness_v2.py","tests/test_r16_five_market_campaign_read_model_v2.py","tests/test_r16_two_market_shadow_source_v1.py","tests/test_r16_canonical_candidate_reader_v1.py")
          python -m pytest @tests -q --tb=short

      - name: Aggregate diagnostic group B
        continue-on-error: true
        shell: pwsh
        run: |
          $tests = @("tests/test_r16_fyers_native_option_capture_v1.py","tests/test_r16_fyers_shadow_composition_v1.py","tests/test_r16_strategy_authority_v1.py","tests/test_r16_selector_paper_runtime_v1.py","tests/test_r16_pre_live_eligibility_v1.py","tests/test_r16_five_market_certification_final_report_v1.py")
          python -m pytest @tests -q --tb=short

      - name: Cross diagnostic A plus r16 fyers native option capture v1
        continue-on-error: true
        shell: pwsh
        run: |
          $tests = @("tests/test_p0_preflight_v2.py","tests/test_fyers_option_chain_provider_v2.py","tests/test_f13_fyers_native_option_chain_engine_v2.py","tests/test_r16_fyers_master_readiness_v2.py","tests/test_r16_five_market_campaign_read_model_v2.py","tests/test_r16_two_market_shadow_source_v1.py","tests/test_r16_canonical_candidate_reader_v1.py","tests/test_r16_fyers_native_option_capture_v1.py")
          python -m pytest @tests -q --tb=short

      - name: Cross diagnostic A plus r16 fyers shadow composition v1
        continue-on-error: true
        shell: pwsh
        run: |
          $tests = @("tests/test_p0_preflight_v2.py","tests/test_fyers_option_chain_provider_v2.py","tests/test_f13_fyers_native_option_chain_engine_v2.py","tests/test_r16_fyers_master_readiness_v2.py","tests/test_r16_five_market_campaign_read_model_v2.py","tests/test_r16_two_market_shadow_source_v1.py","tests/test_r16_canonical_candidate_reader_v1.py","tests/test_r16_fyers_shadow_composition_v1.py")
          python -m pytest @tests -q --tb=short

      - name: Cross diagnostic A plus r16 strategy authority v1
        continue-on-error: true
        shell: pwsh
        run: |
          $tests = @("tests/test_p0_preflight_v2.py","tests/test_fyers_option_chain_provider_v2.py","tests/test_f13_fyers_native_option_chain_engine_v2.py","tests/test_r16_fyers_master_readiness_v2.py","tests/test_r16_five_market_campaign_read_model_v2.py","tests/test_r16_two_market_shadow_source_v1.py","tests/test_r16_canonical_candidate_reader_v1.py","tests/test_r16_strategy_authority_v1.py")
          python -m pytest @tests -q --tb=short

      - name: Cross diagnostic A plus r16 selector paper runtime v1
        continue-on-error: true
        shell: pwsh
        run: |
          $tests = @("tests/test_p0_preflight_v2.py","tests/test_fyers_option_chain_provider_v2.py","tests/test_f13_fyers_native_option_chain_engine_v2.py","tests/test_r16_fyers_master_readiness_v2.py","tests/test_r16_five_market_campaign_read_model_v2.py","tests/test_r16_two_market_shadow_source_v1.py","tests/test_r16_canonical_candidate_reader_v1.py","tests/test_r16_selector_paper_runtime_v1.py")
          python -m pytest @tests -q --tb=short

      - name: Cross diagnostic A plus r16 pre live eligibility v1
        continue-on-error: true
        shell: pwsh
        run: |
          $tests = @("tests/test_p0_preflight_v2.py","tests/test_fyers_option_chain_provider_v2.py","tests/test_f13_fyers_native_option_chain_engine_v2.py","tests/test_r16_fyers_master_readiness_v2.py","tests/test_r16_five_market_campaign_read_model_v2.py","tests/test_r16_two_market_shadow_source_v1.py","tests/test_r16_canonical_candidate_reader_v1.py","tests/test_r16_pre_live_eligibility_v1.py")
          python -m pytest @tests -q --tb=short

      - name: Cross diagnostic A plus r16 five market certification final report v1
        continue-on-error: true
        shell: pwsh
        run: |
          $tests = @("tests/test_p0_preflight_v2.py","tests/test_fyers_option_chain_provider_v2.py","tests/test_f13_fyers_native_option_chain_engine_v2.py","tests/test_r16_fyers_master_readiness_v2.py","tests/test_r16_five_market_campaign_read_model_v2.py","tests/test_r16_two_market_shadow_source_v1.py","tests/test_r16_canonical_candidate_reader_v1.py","tests/test_r16_five_market_certification_final_report_v1.py")
          python -m pytest @tests -q --tb=short

      - name: Focused R16 aggregate gate
        shell: pwsh
        run: |
          $tests = @("tests/test_p0_preflight_v2.py","tests/test_fyers_option_chain_provider_v2.py","tests/test_f13_fyers_native_option_chain_engine_v2.py","tests/test_r16_fyers_master_readiness_v2.py","tests/test_r16_five_market_campaign_read_model_v2.py","tests/test_r16_two_market_shadow_source_v1.py","tests/test_r16_canonical_candidate_reader_v1.py","tests/test_r16_fyers_native_option_capture_v1.py","tests/test_r16_fyers_shadow_composition_v1.py","tests/test_r16_strategy_authority_v1.py","tests/test_r16_selector_paper_runtime_v1.py","tests/test_r16_pre_live_eligibility_v1.py","tests/test_r16_five_market_certification_final_report_v1.py")
          python -m pytest @tests -q --tb=short

      - name: Verify R16 source remains PAPER-only
        shell: pwsh
        run: |
          $paths = @(
            "services/options/r16_fyers_native_option_capture_v1.py",
            "services/paper_orchestration/r16_two_market_shadow_source_v1.py",
            "services/paper_orchestration/r16_canonical_candidate_reader_v1.py",
            "services/paper_orchestration/r16_fyers_shadow_composition_v1.py",
            "services/paper_orchestration/r16_selector_paper_runtime_v1.py",
            "tools/run_r16_two_market_shadow_once.py"
          )
          $forbidden = @(
            "placeOrder(",
            "place_order(",
            "submit_order(",
            "broker_order_submission=True",
            "live_execution_eligible=True"
          )
          foreach ($path in $paths) {
            $source = Get-Content $path -Raw
            foreach ($needle in $forbidden) {
              if ($source.Contains($needle)) {
                Write-Host "FORBIDDEN token $needle in $path"
                exit 1
              }
            }
          }
          Write-Host "R16_PAPER_SAFETY=PASS"