[build-system]
requires = ["setuptools>=61.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-trading-copilot-v2"
version = "0.1.0"
description = "AI Trading Copilot - five-market PAPER runtime"
requires-python = ">=3.11"
dependencies = [
    "fyers-apiv3>=3.1.17",
    "smartapi-python>=1.5.5",
    "PyOTP>=2.10.0",
    "python-dotenv>=1.2.3",
    "pandas>=3.0.5",
    "numpy>=2.5.3",
    "requests>=2.31.0",
    "yfinance>=1.7.0",
    "websocket-client>=1.6.1",
    "websockets>=17.1",
]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
# Correctness-focused selection. The maintained runtime code intentionally
# contains fail-closed defensive patterns (broad except, try/except/pass,
# many branches, magic numbers) that a broader ruleset would flag as
# stylistic concerns but that are intentional and covered by tests.
select = ["E", "F", "W", "I", "UP"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
